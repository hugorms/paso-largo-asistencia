{% extends "base.html" %}{% block title %}Mi cuenta{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Mi cuenta</h1><div class="sub">{{ u.full_name or u.username }} · {{ roles[u.role] }}</div></div></div>
<div class="card" style="max-width:440px"><div class="card-header">Cambiar contraseña</div><div class="card-body">
<form method="post">
  <div class="mb-3"><label class="form-label">Contraseña actual</label><input type="password" name="current" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Nueva contraseña</label><input type="password" name="new" class="form-control" required minlength="8"><div class="form-text">Mínimo 8 caracteres.</div></div>
  <div class="mb-3"><label class="form-label">Repetir nueva contraseña</label><input type="password" name="confirm" class="form-control" required></div>
  <button class="btn btn-primary"><i class="bi bi-check2"></i> Guardar contraseña</button>
</form></div></div>
{% endblock %}
